version: "3.8"

x-minio-common: &minio-common
  image: quay.io/minio/minio:latest
  command: server --console-address ":9090" http://minio{1...2}/data
  expose:
    - "9000"
    - "9090"
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 30s
    timeout: 20s
    retries: 3



services:
  minio1:
    <<: *minio-common
    hostname: minio1
    volumes:
      - ./minio-data1:/data
    networks:
      - minio-net

  minio2:
    <<: *minio-common
    hostname: minio2
    volumes:
      - ./minio-data2:/data
    networks:
      - minio-net
  nginx:
    image: nginx:latest
    container_name: minio-nginx
    ports:
      - "80:80"
      - "9000:9000"
      - "9090:9090"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio1
      - minio2
      - keycloak
      - api
    restart: always
    networks:
      - minio-net
  db:
    image: postgres:latest
    container_name: minio-db
    environment:
      POSTGRES_DB: drive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    restart: always

    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./scripts/entrypoint.sh:/docker-entrypoint-initdb.d/entrypoint.sh
    #entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/entrypoint.sh"]
    networks:
      - minio-net
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    hostname: keycloak.quiz.local
    domainname: quiz.local
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: senha1234
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/drive
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      # ✅ CONFIGURAÇÕES IMPORTANTES PARA HTTP:
      KC_HTTP_ENABLED: 'true'
      KC_HTTPS_REQUIRED: 'none'  # Permite HTTP em desenvolvimento
      KC_SSL_REQUIRED: 'none'    # Desabilita SSL obrigatório
      KC_HOSTNAME_URL: 'http://100.70.218.121/keycloak'  # Seu IP atual
      KC_HOSTNAME_ADMIN_URL: 'http://100.70.218.121/keycloak'
      KC_FEATURES: 'preview'  # Habilita recursos em preview que podem ajudar
    depends_on:
      - db
    command: ["start-dev", "--http-host=0.0.0.0", "--http-port=8080", "--import-realm"]
    volumes:
      - ./keycloak-data:/opt/jboss/keycloak/standalone/data
      - ./keycloak-themes:/opt/jboss/keycloak/themes
      - ./keycloak-realm:/opt/jboss/keycloak/standalone/configuration/keycloak-realm.json
    networks:
      - minio-net
  api:
    build:
      context: ./drive
      dockerfile: Dockerfile
    container_name: minio-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/drive
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SERVER_PORT: 8080
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      IP_LOCAL: ${IP_ACCESS}
      MINIO_URL: http://${IP_ACCESS}:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://${IP_ACCESS}/keycloak/realms/${REALM_NAME}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://${IP_ACCESS}/keycloak/realms/${REALM_NAME}/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ENDPOINT_OIDC_LOGOUT_URI: http://${IP_ACCESS}/keycloak/realms/${REALM_NAME}/protocol/openid-connect/logout
      IMPLICT_LOGIN_URL: http://${IP_ACCESS}/keycloak/realms/${REALM_NAME}/protocol/openid-connect/auth
      TOKEN_URL: http://${IP_ACCESS}/keycloak/realms/${REALM_NAME}/protocol/openid-connect/token
      SERVER_SERVLET_CONTEXT_PATH: /api
      APP_URL: http://${IP_ACCESS}/api
    restart: always
    depends_on:
      - db
      - minio1
      - minio2
    networks:
      - minio-net

networks:
  minio-net: