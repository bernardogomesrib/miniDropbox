spring.application.name=drive
ip.local=100.70.218.121
realm.name=drive

# conexão com o banco de dados postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/drive
spring.datasource.username=postgres
spring.datasource.password=postgres
# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Configurações do servidor
server.port=8080
# Configurações do MinIO
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.url=http://${ip.local}:9000

# configurações do keycloack 
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${ip.local}/keycloak/realms/${realm.name}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${ip.local}/keycloak/realms/${realm.name}/protocol/openid-connect/certs
spring.security.oauth2.authorizationserver.endpoint.oidc.logout-uri=http://${ip.local}/keycloak/realms/${realm.name}/protocol/openid-connect/logout
# keycloak no swagger
implict.login.url=http://${ip.local}/keycloak/realms/${realm.name}/protocol/openid-connect/auth
token.url=http://${ip.local}/keycloak/realms/${realm.name}/protocol/openid-connect/token
app.url=http://${ip.local}/api/



# prefixo da api
server.servlet.context-path=/api

