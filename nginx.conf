events {}

http {
    upstream minio_backend_api {
        server minio1:9000;
        server minio2:9000;
    }

    upstream minio_backend_console {
        server minio1:9090;
        server minio2:9090;
    }

    upstream keycloak_backend {
        server keycloak:8080;
    }

    upstream api_backend {
        server api:8080;
    }

    # Servidor principal na porta 80 para Keycloak
    server {
        listen 80;
        
        # Evita redirecionamentos automáticos para HTTPS
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        
        # Rota para Keycloak: http://192.168.0.9/keycloak/
        location /keycloak/ {
            proxy_pass http://keycloak_backend/keycloak/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Host $host;
            
            # Headers específicos para Keycloak
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
        
        # Rota para API: http://192.168.0.9/api/
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            
            # Headers para APIs REST
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
        
        # Página de índice simples
        location = / {
            return 200 "Services:\n- MinIO API: http://192.168.0.9:9000/\n- MinIO Console: http://192.168.0.9:9090/\n- Keycloak: http://192.168.0.9/keycloak/\n- API: http://192.168.0.9/api/\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 9000;
        location / {
            proxy_pass http://minio_backend_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 9090;
        location / {
            proxy_pass http://minio_backend_console;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

             # WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}